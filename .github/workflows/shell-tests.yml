name: Shell tests

on:
  push:
    branches: [master, install-update]
  pull_request:
    branches: [master, install-update]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends fish zsh
          curl -fsSL --retry 3 https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o "$RUNNER_TEMP/yq"
          printf '%s  %s\n' fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4 "$RUNNER_TEMP/yq" | sha256sum --check --status
          sudo install -m 0755 "$RUNNER_TEMP/yq" /usr/local/bin/yq
          curl -fsSL --retry 3 https://github.com/MetaCubeX/mihomo/releases/download/v1.19.27/mihomo-linux-amd64-v1.19.27.gz -o "$RUNNER_TEMP/mihomo.gz"
          printf '%s  %s\n' fb3e34c55844f389ff54679e5a3aec331d5ec38006c20f8dcc476fb47768a58f "$RUNNER_TEMP/mihomo.gz" | sha256sum --check --status
          gzip -dc "$RUNNER_TEMP/mihomo.gz" > "$RUNNER_TEMP/mihomo"
          sudo install -m 0755 "$RUNNER_TEMP/mihomo" /usr/local/bin/mihomo-test
      - name: Check Bash syntax
        run: git ls-files -z -- '*.sh' | xargs -0 -r -n 1 bash -n
      - name: Run regression suite
        run: sudo TEST_MIHOMO=/usr/local/bin/mihomo-test bash tests/run-all.sh
      - name: Run installation and service tests as a regular user
        run: TEST_MIHOMO=/usr/local/bin/mihomo-test bash tests/run-all.sh install-update install-legacy-nohup install-service systemd-user no-subscription notebook sub-base64
